<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page Not Found | Muslim Commerce College Peshawar</title>
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('mca_settings') || '{}');
        var t = (s.appearance && s.appearance.theme) || 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (s.appearance && s.appearance.primary) {
          document.documentElement.style.setProperty('--color-primary', s.appearance.primary);
        }
      } catch (e) { /* first run */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .not-found-card { width: min(540px, 100%); text-align: center; }
    .not-found-code { font-size: 72px; font-weight: 800; line-height: 1; color: var(--color-primary); letter-spacing: -2px; }
    .not-found-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  </style>
</head>
<body class="login-page">
  <main class="not-found-shell">
    <section class="login-card not-found-card">
      <img class="login-logo" src="assets/logo.png" alt="Muslim Commerce College Peshawar logo">
      <p class="not-found-code">404</p>
      <h1>Page not found</h1>
      <p class="login-sub">The page or route you requested does not exist. Check the address or use one of the links below.</p>
      <div class="not-found-actions">
        <a class="btn btn-primary" href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
        <a class="btn btn-outline" href="admin.html"><i class="fa-solid fa-shield-halved"></i> Administration</a>
        <a class="btn btn-outline" href="teacher-login.html"><i class="fa-solid fa-chalkboard-user"></i> Teacher Portal</a>
      </div>
    </section>
  </main>
</body>
</html>
