<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create examinations, enter marks, auto-calculate results and generate Detail Marks Certificates (DMC) at Muslim Commerce College Peshawar.">
  <title>Examination System — Attendance Management System | Muslim Commerce College Peshawar</title>

  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('mca_settings') || '{}');
        var t = (s.appearance && s.appearance.theme) || 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (s.appearance && s.appearance.primary) {
          document.documentElement.style.setProperty('--color-primary', s.appearance.primary);
        }
      } catch (e) { /* first run */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/exams.css">
</head>

<body data-page="examinations" data-title="Examination System">

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">

        <div class="page-header">
          <div>
            <h2>Examination System</h2>
            <p class="page-sub">Create examinations, manage subjects, enter marks, calculate results and generate Detailed Marks Certificates.</p>
          </div>
        </div>

        <!-- ================= Tab bar rendered by js/exams.js ================= -->
        <div class="exam-tabbar" id="examTabbar" role="tablist"></div>

        <!-- ================= Tab content rendered by js/exams.js ================= -->
        <section id="examContent"></section>

      </main>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="js/api.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/print.js"></script>
  <script src="js/exams.js"></script>
</body>
</html>
