<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Faculty directory of Muslim Commerce College Peshawar.">
  <title>Teachers — Attendance Management System | Muslim Commerce College Peshawar</title>

  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('mca_settings') || '{}');
        var t = (s.appearance && s.appearance.theme) || 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (s.appearance && s.appearance.primary) {
          document.documentElement.style.setProperty('--color-primary', s.appearance.primary);
        }
      } catch (e) { /* first run */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="teachers" data-title="Teachers">

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <div class="main">
      <header class="topbar" id="topbar"></header>

      <main class="content">

        <div class="page-header">
          <div>
            <h2>Teachers</h2>
            <p class="page-sub">Faculty directory with assigned classes and contact details.</p>
          </div>
          <div class="page-actions">
            <button type="button" class="btn btn-primary" id="addTeacherBtn">
              <i class="fa-solid fa-plus"></i> Add Teacher
            </button>
          </div>
        </div>

        <div class="card">
          <div class="card-body flush">
            <div class="table-scroll">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Teacher ID</th>
                    <th>Teacher Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Assigned Classes</th>
                    <th>Status</th>
                    <th class="text-right">Actions</th>
                  </tr>
                </thead>
                <tbody id="teacherTableBody">
                  <tr><td colspan="7" class="muted">Loading teachers…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add / edit teacher modal -->
  <div class="modal-backdrop" id="teacherModal" role="dialog" aria-modal="true" aria-labelledby="teacherModalTitle">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3 id="teacherModalTitle">Add Teacher</h3>
        <button type="button" class="icon-btn" data-modal-close aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="teacherForm" novalidate>
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="fTeacherId">Teacher ID <span class="req">*</span></label>
              <input class="form-input" type="text" id="fTeacherId" name="teacherId"
                     placeholder="TCH-013" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="fTeacherName">Teacher Name <span class="req">*</span></label>
              <input class="form-input" type="text" id="fTeacherName" name="name"
                     placeholder="Full name" minlength="3" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="fTeacherSubject">Primary Subject</label>
              <input class="form-input" type="text" id="fTeacherSubject" name="subject"
                     placeholder="e.g. Accounting">
            </div>
            <div class="form-group">
              <label class="form-label" for="fTeacherStatus">Status</label>
              <select class="form-select" id="fTeacherStatus" name="status">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="fTeacherEmail">Email <span class="req">*</span></label>
              <input class="form-input" type="email" id="fTeacherEmail" name="email"
                     placeholder="teacher@college.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="fTeacherPhone">Phone</label>
              <input class="form-input" type="tel" id="fTeacherPhone" name="phone"
                     placeholder="03XXXXXXXXX" pattern="03[0-9]{9}" title="Format: 03XXXXXXXXX (11 digits)">
            </div>

            <div class="form-group span-2">
              <label class="form-label">Assigned Classes <span class="req">*</span></label>
              <div class="check-list" id="teacherClassList"></div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
          <button type="button" class="btn btn-primary" id="saveTeacherBtn">
            <i class="fa-solid fa-floppy-disk"></i> Save Teacher
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-stack" id="toastStack"></div>

  <script src="js/api.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/teachers.js"></script>
</body>
</html>
