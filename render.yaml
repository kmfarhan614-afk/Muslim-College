services:
  - type: web
    name: muslim-college
    runtime: node
    plan: starter
    buildCommand: echo skip-build
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        value: admin@college.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
    disk:
      name: mca-data
      mountPath: /var/data
      sizeGB: 1
